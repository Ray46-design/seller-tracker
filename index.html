<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seller Profit &amp; Stock Tracker</title>
<meta name="description" content="Track sales, stock, profit and who owes you. Made for small online sellers in Kenya. Works offline.">
<meta name="theme-color" content="#1F5E3B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seller Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app with a bottom tab bar; becomes a top tab row and two-column panels on wide screens. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#14201A; --muted:#5C6B63; --line:#DCE4DF;
  --accent:#1F5E3B; --accent-ink:#FFFFFF; --accent-soft:#E1EFE6;
  --bar2:#A88510; --warn:#8A4B08; --warn-soft:#FDEBD0; --bad:#B42318; --bad-soft:#FBE3E0; --good:#1F7A4A;
  --field:#FFFFFF;
  --c1:#1F5E3B; --c2:#B07D12; --c3:#2F6FAB; --c4:#B5533C; --c5:#7A5AA6; --c6:#1F8A87; --c7:#7B8580;
  --head:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

/* accent presets (light), then dark versions further below */
:root[data-accent="blue"]{--accent:#1E4F9C; --accent-ink:#FFFFFF; --accent-soft:#E0EAF8}
:root[data-accent="purple"]{--accent:#5B3A9E; --accent-ink:#FFFFFF; --accent-soft:#EAE2F6}
:root[data-accent="terracotta"]{--accent:#A4452C; --accent-ink:#FFFFFF; --accent-soft:#F8E4DC}
:root[data-accent="teal"]{--accent:#0F6B6A; --accent-ink:#FFFFFF; --accent-soft:#DDF0EF}
:root[data-accent="slate"]{--accent:#334155; --accent-ink:#FFFFFF; --accent-soft:#E2E8F0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#17211C; --ink:#E8EFEA; --muted:#9AAAA1; --line:#2A3831;
    --accent:#5DBB87; --accent-ink:#08140D; --accent-soft:#1D3327;
    --bar2:#E0B94A; --warn:#F0B35A; --warn-soft:#3A2C14; --bad:#F28B82; --bad-soft:#3B1D1A; --good:#5DBB87;
    --field:#101915; color-scheme:dark;
    --c1:#5DBB87; --c2:#E0B94A; --c3:#6AA7E0; --c4:#E08A73; --c5:#AE92D6; --c6:#5CCBC8; --c7:#9AA39E;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --ink:#E8EFEA; --muted:#9AAAA1; --line:#2A3831;
  --accent:#5DBB87; --accent-ink:#08140D; --accent-soft:#1D3327;
  --bar2:#E0B94A; --warn:#F0B35A; --warn-soft:#3A2C14; --bad:#F28B82; --bad-soft:#3B1D1A; --good:#5DBB87;
  --field:#101915; color-scheme:dark;
    --c1:#5DBB87; --c2:#E0B94A; --c3:#6AA7E0; --c4:#E08A73; --c5:#AE92D6; --c6:#5CCBC8; --c7:#9AA39E;
}
/* accent presets (dark): placed after the dark defaults and more specific */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="blue"]{--accent:#7AA8F0; --accent-ink:#08121F; --accent-soft:#1B2A44}
  :root:not([data-theme="light"])[data-accent="purple"]{--accent:#B39BEA; --accent-ink:#120A24; --accent-soft:#2B2140}
  :root:not([data-theme="light"])[data-accent="terracotta"]{--accent:#E8917A; --accent-ink:#240E08; --accent-soft:#3D221B}
  :root:not([data-theme="light"])[data-accent="teal"]{--accent:#5CCBC8; --accent-ink:#061A19; --accent-soft:#14312F}
  :root:not([data-theme="light"])[data-accent="slate"]{--accent:#A9B8CC; --accent-ink:#0B1119; --accent-soft:#232C38}
}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7AA8F0; --accent-ink:#08121F; --accent-soft:#1B2A44}
:root[data-theme="dark"][data-accent="purple"]{--accent:#B39BEA; --accent-ink:#120A24; --accent-soft:#2B2140}
:root[data-theme="dark"][data-accent="terracotta"]{--accent:#E8917A; --accent-ink:#240E08; --accent-soft:#3D221B}
:root[data-theme="dark"][data-accent="teal"]{--accent:#5CCBC8; --accent-ink:#061A19; --accent-soft:#14312F}
:root[data-theme="dark"][data-accent="slate"]{--accent:#A9B8CC; --accent-ink:#0B1119; --accent-soft:#232C38}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 var(--body); overflow-wrap:anywhere;
  padding-block:18px 132px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:1040px; margin:0 auto}
h1,h2,h3{font-family:var(--head); margin:0; line-height:1.15; text-wrap:balance}
h1{font-size:26px; letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.top{margin-bottom:14px}
.top p{margin-top:4px}

/* tabs */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:4px;
  background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));
}
nav a{
  flex:1; text-align:center; text-decoration:none; color:var(--muted); font-weight:500; font-size:13px;
  padding:10px 4px; border-radius:8px;
}
nav a[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (min-width:820px){
  body{padding-block:28px 40px}
  nav{position:static; border:0; background:transparent; padding:0; margin-bottom:18px; gap:6px; justify-content:flex-start}
  nav a{flex:0 0 auto; padding:9px 18px; font-size:14px}
}

/* surfaces */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0}
.stack{display:flex; flex-direction:column; gap:14px}
.grid2{display:grid; gap:14px; grid-template-columns:1fr}
@media (min-width:820px){ .grid2{grid-template-columns:1fr 1fr} }
.head-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.banner{background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:12px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.banner p{min-width:0; flex:1 1 220px}
.flash{background:var(--accent-soft); color:var(--accent); border-radius:10px; padding:10px 14px; font-weight:500}
.flash.err{background:var(--bad-soft); color:var(--bad)}

/* kpis */
.kpis{display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:820px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0}
.kpi .lab{font-size:12.5px; color:var(--muted); font-weight:500}
.kpi .val{font-family:var(--head); font-size:22px; font-weight:700; margin-top:4px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px; color:var(--muted); margin-top:2px}
.kpi.main{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.kpi.main .lab,.kpi.main .sub{color:var(--accent-ink); opacity:.85}
.neg{color:var(--bad)}
.form-msg{margin-top:12px}
[hidden]{display:none!important}
.seg{display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:10px; background:var(--bg)}
.seg button,.chip{font:500 13px/1 var(--body); color:var(--muted); background:transparent; border:1px solid transparent; border-radius:8px; padding:11px 13px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:700}
.piewrap{display:grid; gap:16px; grid-template-columns:minmax(0,1fr); align-items:center; margin-top:14px}
@media (min-width:600px){ .piewrap{grid-template-columns:minmax(0,260px) minmax(0,1fr)} }
.pie-box{max-width:260px; width:100%; margin:0 auto}
.pie{width:100%; height:auto; display:block}
.pie .pie-top{fill:var(--muted); font:500 12px var(--body)}
.pie .pie-val{fill:var(--ink); font:700 17px var(--head)}
.legend-list{list-style:none; margin:0; padding:0; min-width:0}
.lg{display:grid; grid-template-columns:12px minmax(0,1fr) auto 54px; gap:8px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
.lg:first-child{border-top:0}
.lg .sw{width:12px; height:12px; border-radius:3px}
.lg .v{font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
.lg .p{color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}
.kpi.main .neg{color:var(--accent-ink)}

/* forms */
form .fields{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:500; color:var(--muted); min-width:0}
input,select,textarea{
  font:16px/1.3 var(--body); color:var(--ink); background:var(--field); border:1px solid var(--line);
  border-radius:8px; padding:10px 11px; width:100%; min-width:0;
}
textarea{resize:vertical}
.btn{
  font:700 14px/1 var(--body); border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  padding:12px 16px; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.small{padding:8px 11px; font-size:13px}
.btn.danger{background:transparent; color:var(--bad); border-color:var(--bad)}
.btn.plain{background:transparent; border-color:transparent; color:var(--muted); font-weight:500}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px}
.preview{background:var(--accent-soft); color:var(--ink); border-radius:8px; padding:10px 12px; margin-top:12px; font-size:14px}
.preview b{font-variant-numeric:tabular-nums}
.preview .warn{color:var(--warn); font-weight:700}

/* lists */
.list{display:flex; flex-direction:column}
.row{display:flex; gap:12px; justify-content:space-between; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); min-width:0}
.row:first-child{border-top:0}
.row .l{min-width:0; flex:1}
.row .r{text-align:right; flex:none; max-width:46%}
.row .t{font-weight:700; overflow-wrap:anywhere}
.row .s{font-size:13px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere}
.row .tools{display:flex; gap:6px; justify-content:flex-end; margin-top:8px; flex-wrap:wrap; align-items:center}
.row .tools form{display:flex; gap:6px; align-items:center}
.row .tools input{width:90px; padding:7px 9px; font-size:14px}
.good{color:var(--good); font-weight:700}
.pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 8px; border-radius:99px; margin-left:6px; vertical-align:2px}
.pill.ok{background:var(--accent-soft); color:var(--accent)}
.pill.low{background:var(--warn-soft); color:var(--warn)}
.pill.out{background:var(--bad-soft); color:var(--bad)}

/* bars + chart */
.bar{margin-top:10px}
.bar-top{display:flex; justify-content:space-between; gap:10px; font-size:14px}
.bar-top b{font-variant-numeric:tabular-nums}
.track{height:8px; background:var(--accent-soft); border-radius:99px; margin-top:5px; overflow:hidden}
.track i{display:block; height:100%; background:var(--accent); border-radius:99px}
.legend{display:flex; gap:16px; font-size:13px; color:var(--muted); flex-wrap:wrap}
.legend span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; background:var(--accent)}
.legend span.b2::before{background:var(--bar2)}
.chart{width:100%; height:auto; display:block; margin-top:8px}
.chart text{fill:var(--muted); font:500 17px var(--body)}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .zero{stroke:var(--muted); stroke-width:1.5}
.chart .b1{fill:var(--accent)}
.chart .b2{fill:var(--bar2)}
details summary{cursor:pointer; color:var(--accent); font-weight:500; margin-top:10px}
.lists{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (prefers-reduced-motion:no-preference){ .track i{transition:width .3s ease} }

/* nav with six tabs, owed badge, quick-sale button and sheet */
nav a{padding:10px 2px; font-size:12.5px}
nav a{position:relative; white-space:nowrap}
.badge{position:absolute; top:0; right:0; min-width:16px; padding:0 4px; border-radius:99px; background:var(--warn-soft); color:var(--warn); font-size:11px; font-weight:700; line-height:1.4}
@media (min-width:820px){ nav a{padding:9px 18px; font-size:14px} }
.fab{position:fixed; z-index:6; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(70px + env(safe-area-inset-bottom,0px)); border-radius:99px; padding:15px 20px; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.28)}
@media (min-width:820px){ .fab{bottom:28px} }
.sheet-back{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); color:var(--ink); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
@media (min-width:820px){ .sheet-back{align-items:center} .sheet{border-radius:16px} }
html.lock{overflow:hidden}
.banner .btn.ghost{color:var(--warn); border-color:var(--warn); text-decoration:none}
.owes{color:var(--warn); font-weight:700}
.owe-group{padding:14px 0; border-top:1px solid var(--line)}
.owe-group:first-child{border-top:0}
.owe-head{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){ .kpis3{grid-template-columns:minmax(0,1fr)} }
.small-val{font-size:16px!important}
.ln{fill:none; stroke-width:3; stroke-linejoin:round; stroke-linecap:round}
.ln1{stroke:var(--accent)} .ln2{stroke:var(--bar2); stroke-dasharray:8 5}
.dot1{fill:var(--accent)} .dot2{fill:var(--bar2)}
.dotsw{display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px; vertical-align:-1px; box-shadow:0 0 0 1.5px var(--ink)}
.dotsw[data-c="green"]{background:#1F5E3B} .dotsw[data-c="blue"]{background:#1E4F9C} .dotsw[data-c="purple"]{background:#5B3A9E}
.dotsw[data-c="terracotta"]{background:#A4452C} .dotsw[data-c="teal"]{background:#0F6B6A} .dotsw[data-c="slate"]{background:#334155}
code{font:13px ui-monospace, Menlo, Consolas, monospace; background:var(--bg); padding:1px 5px; border-radius:4px}
:root[data-density="compact"] .card{padding:12px}
:root[data-density="compact"] .kpi{padding:10px}
:root[data-density="compact"] .row{padding:8px 0}
:root[data-density="compact"] .lg{padding:6px 0}
:root[data-density="compact"] .stack{gap:10px}
:root[data-density="compact"] form .fields{gap:8px}
:root[data-density="compact"] .kpi .val{font-size:19px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1 id="shopName">My Shop</h1>
    <p class="muted small">Profit &amp; stock tracker. All amounts in KES.</p>
  </header>
  <nav aria-label="Sections" id="nav">
    <a href="#home">Home</a><a href="#sales">Sales</a><a href="#owed" id="owedLink">Owed<span class="badge" id="owedBadge" hidden></span></a><a href="#stock">Stock</a><a href="#costs">Costs</a><a href="#setup">Setup</a>
  </nav>
  <main id="view"></main>
</div>
<button type="button" class="btn fab" id="fab" data-act="open-sheet" hidden>+ Sale</button>
<div id="sheetHost"></div>

<script>
/*PURE-START*/
var LISTS = {
  cats: ['Clothes','Shoes','Beauty','Electronics','Phone Accessories','Home & Kitchen','Food & Snacks','Kids','Accessories','Other'],
  channels: ['WhatsApp','Instagram','Facebook','TikTok','Jumia / Kilimall','Walk-in','Referral','Other'],
  pays: ['M-Pesa','Cash','Bank Transfer','Card','Other'],
  expCats: ['Delivery / Boda','Packaging','Airtime & Data','Advertising','Rent','Transport','Helper / Salaries','Licences & Fees','Repairs','Other']
};
var ACCENTS = ['green','blue','purple','terracotta','teal','slate'];
function p2(n){ return (n < 10 ? '0' : '') + n; }
function blankData(year){
  var o = {shop:'My Shop', year:year, low:5, sample:false, view:'pie', breakdown:'money', trend:'weekly', layout:'pie', density:'comfortable', accent:'green', welcomed:false, lastBackup:'', nextId:1, products:[], sales:[], expenses:[]};
  var c = JSON.parse(JSON.stringify(LISTS));
  for (var k in c) o[k] = c[k];
  return o;
}
function sampleData(){
  var o = blankData(2026);
  o.shop = 'Mama Njeri Fashion & Gadgets'; o.sample = true;
  var P = function(sku,name,cat,buy,sell,open,restock){ return {sku:sku,name:name,cat:cat,buy:buy,sell:sell,open:open,restock:restock}; };
  o.products = [
    P('SH-001',"Women's Sneakers",'Shoes',1800,2800,12,0),
    P('BT-001','Body Lotion 400ml','Beauty',350,650,30,20),
    P('PH-001','Phone Case (A-series)','Phone Accessories',150,400,50,0),
    P('PH-002','Fast Charger 25W','Phone Accessories',600,1200,20,0),
    P('HK-001','Non-stick Frying Pan','Home & Kitchen',900,1500,10,0),
    P('CL-001',"Men's Hoodie",'Clothes',1100,2000,15,0)
  ];
  var id = 1;
  var S = function(date,sku,qty,disc,pay,ch,cust,paid){
    var p = o.products.filter(function(x){ return x.sku === sku; })[0];
    var r = {id:id++,date:date,sku:sku,qty:qty,discount:disc,pay:pay,channel:ch,customer:cust,price:p.sell,cost:p.buy};
    if (paid !== undefined) r.paid = paid;
    o.sales.push(r);
  };
  S('2026-10-28','PH-001',3,0,'M-Pesa','WhatsApp','Amina');
  S('2026-10-29','SH-001',1,0,'M-Pesa','Instagram','Brian');
  S('2026-10-30','BT-001',2,0,'Cash','Walk-in','Grace');
  S('2026-11-01','PH-002',1,100,'M-Pesa','Facebook','Kevin');
  S('2026-11-02','HK-001',1,0,'M-Pesa','WhatsApp','Joyce');
  S('2026-11-03','CL-001',2,200,'M-Pesa','Instagram','Dennis',2000);
  S('2026-11-05','SH-001',2,0,'M-Pesa','WhatsApp','Faith');
  S('2026-11-07','BT-001',5,250,'M-Pesa','TikTok','Lucy');
  S('2026-11-08','PH-001',6,0,'Cash','Walk-in','Walk-in');
  S('2026-11-10','SH-001',3,300,'M-Pesa','Instagram','Mercy');
  S('2026-11-12','SH-001',2,0,'M-Pesa','Facebook','Ian');
  S('2026-11-14','CL-001',4,0,'Bank Transfer','Referral','Peter');
  S('2026-11-15','PH-002',3,0,'M-Pesa','WhatsApp','Naomi');
  S('2026-11-16','HK-001',2,0,'M-Pesa','Facebook','Susan',0);
  var E = function(date,cat,desc,amount,pay){ o.expenses.push({id:id++,date:date,cat:cat,desc:desc,amount:amount,pay:pay}); };
  E('2026-10-30','Delivery / Boda','Deliveries around town',400,'M-Pesa');
  E('2026-11-01','Packaging','Boxes and tape',650,'M-Pesa');
  E('2026-11-03','Airtime & Data','Bundles for orders',500,'M-Pesa');
  E('2026-11-06','Advertising','Facebook boost',1000,'M-Pesa');
  E('2026-11-12','Delivery / Boda','Customer deliveries',600,'Cash');
  o.nextId = id;
  return o;
}

/* ---- dates (ISO strings, UTC arithmetic so time zones never shift a day) ---- */
function isoToUtc(iso){ return Date.UTC(+iso.slice(0,4), +iso.slice(5,7) - 1, +iso.slice(8,10)); }
function utcToIso(ms){ var d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
function isoAdd(iso, days){ return utcToIso(isoToUtc(iso) + days * 86400000); }
function mondayOf(iso){ var dow = (new Date(isoToUtc(iso)).getUTCDay() + 6) % 7; return isoAdd(iso, -dow); }

/* ---- sales with payment status ---- */
function enrich(S){
  var pm = {};
  S.products.forEach(function(p){ pm[p.sku] = p; });
  var rows = S.sales.map(function(s){
    var p = pm[s.sku];
    var price = s.price !== undefined ? s.price : (p ? p.sell : 0);
    var unitCost = s.cost !== undefined ? s.cost : (p ? p.buy : 0);
    var total = s.qty * price - (s.discount || 0);
    var cost = s.qty * unitCost;
    var paid = total;
    if (s.paid !== undefined) paid = total > 0 ? Math.max(0, Math.min(s.paid, total)) : total;
    return {id:s.id, date:s.date, sku:s.sku, qty:s.qty, discount:s.discount || 0, pay:s.pay, channel:s.channel, customer:s.customer,
            name:p ? p.name : 'Removed product', total:total, cost:cost, profit:total - cost, paid:paid, owed:total - paid};
  });
  var sold = {}, profit = {};
  rows.forEach(function(r){ sold[r.sku] = (sold[r.sku] || 0) + r.qty; profit[r.sku] = (profit[r.sku] || 0) + r.profit; });
  var stock = S.products.map(function(p){
    var s = sold[p.sku] || 0, left = p.open + p.restock - s;
    return {sku:p.sku, name:p.name, cat:p.cat, buy:p.buy, sell:p.sell, open:p.open, restock:p.restock,
            sold:s, left:left, status:left <= 0 ? 'out' : (left <= S.low ? 'low' : 'ok'),
            unit:p.sell - p.buy, margin:p.sell ? (p.sell - p.buy) / p.sell : 0, profitAll:profit[p.sku] || 0};
  });
  return {pm:pm, rows:rows, stock:stock};
}
function summary(S, E, year){
  var y = String(year);
  var rows = E.rows.filter(function(r){ return String(r.date).slice(0,4) === y; });
  var ex = S.expenses.filter(function(x){ return String(x.date).slice(0,4) === y; });
  var mSales = [], mGross = [], mExp = [], i;
  for (i = 0; i < 12; i++){ mSales.push(0); mGross.push(0); mExp.push(0); }
  var byChannel = {}, byPay = {}, bySku = {}, byExpCat = {};
  rows.forEach(function(r){
    var m = parseInt(String(r.date).slice(5,7), 10) - 1;
    if (m >= 0 && m < 12){ mSales[m] += r.total; mGross[m] += r.profit; }
    byChannel[r.channel || 'Other'] = (byChannel[r.channel || 'Other'] || 0) + r.total;
    byPay[r.pay || 'Other'] = (byPay[r.pay || 'Other'] || 0) + r.paid;
    if (r.owed > 0) byPay['Still owed'] = (byPay['Still owed'] || 0) + r.owed;
    if (!bySku[r.sku]) bySku[r.sku] = {name:r.name, profit:0, qty:0, total:0};
    bySku[r.sku].profit += r.profit; bySku[r.sku].qty += r.qty; bySku[r.sku].total += r.total;
  });
  ex.forEach(function(x){
    byExpCat[x.cat || 'Other'] = (byExpCat[x.cat || 'Other'] || 0) + x.amount;
    var m = parseInt(String(x.date).slice(5,7), 10) - 1;
    if (m >= 0 && m < 12) mExp[m] += x.amount;
  });
  var sum = function(a){ return a.reduce(function(p,c){ return p + c; }, 0); };
  var sales = sum(mSales), gross = sum(mGross), exp = sum(mExp);
  var best = Object.keys(bySku).map(function(k){ return bySku[k]; }).filter(function(b){ return b.profit > 0; })
              .sort(function(a,b){ return b.profit - a.profit; }).slice(0,5);
  return {count:rows.length, sales:sales, cogs:sales - gross, gross:gross, exp:exp, net:gross - exp,
          margin:sales ? (gross - exp) / sales : 0, grossMargin:sales ? gross / sales : 0,
          mSales:mSales, mNet:mGross.map(function(g,j){ return g - mExp[j]; }),
          byChannel:byChannel, byPay:byPay, best:best, byExpCat:byExpCat,
          byProduct:Object.keys(bySku).map(function(k){ return {name:bySku[k].name, total:bySku[k].total}; })};
}

/* ---- weeks (Monday to Sunday) ---- */
function periodTotals(S, E, from, to){
  var sales = 0, gross = 0, count = 0, units = 0, byP = {}, exp = 0;
  E.rows.forEach(function(r){
    if (r.date >= from && r.date <= to){
      sales += r.total; gross += r.profit; count++; units += r.qty;
      if (!byP[r.sku]) byP[r.sku] = {name:r.name, profit:0};
      byP[r.sku].profit += r.profit;
    }
  });
  S.expenses.forEach(function(x){ if (x.date >= from && x.date <= to) exp += x.amount; });
  var best = null;
  Object.keys(byP).forEach(function(k){ if (byP[k].profit > 0 && (!best || byP[k].profit > best.profit)) best = byP[k]; });
  return {from:from, to:to, sales:sales, gross:gross, exp:exp, net:gross - exp, count:count, units:units, best:best};
}
function weeklyTrend(S, E, endIso, n){
  var start = mondayOf(endIso), out = [], i;
  for (i = n - 1; i >= 0; i--){ var ws = isoAdd(start, -7 * i); out.push(periodTotals(S, E, ws, isoAdd(ws, 6))); }
  return out;
}
function weekCompare(S, E, todayIso){
  var ws = mondayOf(todayIso);
  return {cur:periodTotals(S, E, ws, isoAdd(ws, 6)), prev:periodTotals(S, E, isoAdd(ws, -7), isoAdd(ws, -1))};
}

/* ---- who owes you ---- */
function owedList(E){
  var groups = {}, total = 0, count = 0;
  E.rows.forEach(function(r){
    if (r.owed > 0){
      var name = (r.customer || '').trim() || 'No name', key = name.toLowerCase();
      var g = groups[key] || (groups[key] = {key:key, customer:name, owed:0, sales:[], oldest:r.date});
      g.owed += r.owed; g.sales.push(r); if (r.date < g.oldest) g.oldest = r.date;
      total += r.owed; count++;
    }
  });
  var list = Object.keys(groups).map(function(k){ return groups[k]; }).sort(function(a,b){ return b.owed - a.owed; });
  list.forEach(function(g){ g.sales.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id; }); });
  return {list:list, total:total, count:count};
}

var MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function toNum(v){
  if (v === undefined || v === null) return null;
  var s = String(v).replace(/kes|ksh\.?|\s|,/gi, '');
  if (s === '' || !/^-?\d*\.?\d+$/.test(s)) return null;
  return parseFloat(s);
}
function ci(list, v){
  var t = String(v || '').trim().toLowerCase(), i;
  if (!t) return null;
  for (i = 0; i < list.length; i++){ if (list[i].toLowerCase() === t) return list[i]; }
  return null;
}
function pickFrom(list, v){
  if (!String(v || '').trim()) return list[0];
  return ci(list, v) || (list.indexOf('Other') >= 0 ? 'Other' : list[0]);
}
function splitLine(line, d){
  var out = [], cur = '', q = false, i, c;
  for (i = 0; i < line.length; i++){
    c = line.charAt(i);
    if (q){
      if (c === '"'){ if (line.charAt(i + 1) === '"'){ cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"' && cur.trim() === ''){ q = true; cur = ''; }
    else if (c === d){ out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}
function parseTable(text){
  var lines = String(text || '').replace(/\r/g, '').split('\n');
  var sample = lines.filter(function(l){ return l.trim() !== ''; }).slice(0, 20).join('\n');
  var d = ',';
  if (sample.indexOf('\t') >= 0) d = '\t';
  else if ((sample.match(/;/g) || []).length > (sample.match(/,/g) || []).length) d = ';';
  var rows = [];
  lines.forEach(function(l, i){ if (l.trim() !== '') rows.push({line:i + 1, raw:l, cells:splitLine(l, d)}); });
  return rows;
}
function validYMD(y, m, d){
  if (!(y >= 2000 && y <= 2100 && m >= 1 && m <= 12 && d >= 1)) return false;
  return d <= new Date(Date.UTC(y, m, 0)).getUTCDate();
}
function parseDate(str){
  var s = String(str || '').trim(), m, y, mo, d;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))){ y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/))){ d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
  else if ((m = s.match(/^(\d{1,2})[ \-]([A-Za-z]{3,9})[ ,\-]*(\d{2}|\d{4})$/))){ d = +m[1]; mo = MONTHS[m[2].slice(0, 3).toLowerCase()]; y = +m[3]; if (y < 100) y += 2000; }
  else return null;
  if (!mo || !validYMD(y, mo, d)) return null;
  return y + '-' + p2(mo) + '-' + p2(d);
}
function importProducts(S, rows){
  var ok = [], bad = [], seen = {};
  S.products.forEach(function(p){ seen[p.sku.toLowerCase()] = 1; });
  rows.forEach(function(r, i){
    var c = r.cells, fail = function(why){ bad.push({line:r.line, raw:r.raw, reason:why}); };
    if (i === 0 && /sku/i.test(c[0] || '')) return;
    var sku = (c[0] || '').trim(), name = (c[1] || '').trim();
    if (!sku || !name) return fail('Needs a SKU and a product name');
    if (sku.length > 20) return fail('SKU is longer than 20 characters');
    if (name.length > 60) return fail('Product name is longer than 60 characters');
    if (seen[sku.toLowerCase()]) return fail('SKU ' + sku + ' already exists');
    var buy = toNum(c[3]), sell = toNum(c[4]), open = (c[5] === undefined || c[5] === '') ? 0 : toNum(c[5]);
    if (buy === null || buy < 0 || sell === null || sell < 0) return fail('Buying and selling price must be numbers of 0 or more');
    if (open === null || open < 0 || open % 1 !== 0) return fail('Opening stock must be a whole number');
    seen[sku.toLowerCase()] = 1;
    ok.push({sku:sku, name:name, cat:pickFrom(S.cats, c[2]), buy:buy, sell:sell, open:open, restock:0});
  });
  return {ok:ok, bad:bad};
}
function importSales(S, rows){
  var E = enrich(S), left = {}, by = {}, ok = [], bad = [];
  E.stock.forEach(function(p){ left[p.sku] = p.left; by[p.sku.toLowerCase()] = p; });
  rows.forEach(function(r, i){
    var c = r.cells, fail = function(why){ bad.push({line:r.line, raw:r.raw, reason:why}); };
    if (i === 0 && /date/i.test(c[0] || '')) return;
    var date = parseDate(c[0]);
    if (!date) return fail('Date not understood. Use 17/11/2026 or 2026-11-17');
    var p = by[(c[1] || '').trim().toLowerCase()];
    if (!p) return fail('SKU not found: ' + (c[1] || '(empty)'));
    var qty = toNum(c[2]);
    if (qty === null || qty < 1 || qty % 1 !== 0) return fail('Quantity must be a whole number of 1 or more');
    var disc = (c[3] === undefined || c[3] === '') ? 0 : toNum(c[3]);
    if (disc === null || disc < 0) return fail('Discount must be a number of 0 or more');
    if (disc > qty * p.sell) return fail('Discount is more than the sale amount');
    if (qty > left[p.sku]) return fail('Only ' + Math.max(left[p.sku], 0) + ' of ' + p.sku + ' in stock. Add stock first');
    var total = qty * p.sell - disc, paid = (c[7] === undefined || c[7] === '') ? total : toNum(c[7]);
    if (paid === null || paid < 0 || paid > total) return fail('Amount paid must be between 0 and ' + total);
    var cust = (c[6] || '').trim();
    if (paid < total && !cust) return fail('Add the customer name for a sale that is not fully paid');
    left[p.sku] -= qty;
    var rec = {date:date, sku:p.sku, qty:qty, discount:disc, pay:pickFrom(S.pays, c[4]), channel:pickFrom(S.channels, c[5]), customer:cust, price:p.sell, cost:p.buy};
    if (paid < total) rec.paid = paid;
    ok.push(rec);
  });
  return {ok:ok, bad:bad};
}
function importExpenses(S, rows){
  var ok = [], bad = [];
  rows.forEach(function(r, i){
    var c = r.cells, fail = function(why){ bad.push({line:r.line, raw:r.raw, reason:why}); };
    if (i === 0 && /date/i.test(c[0] || '')) return;
    var date = parseDate(c[0]);
    if (!date) return fail('Date not understood. Use 17/11/2026 or 2026-11-17');
    var amt = toNum(c[3]);
    if (amt === null || amt <= 0) return fail('Amount must be a number above 0');
    ok.push({date:date, cat:pickFrom(S.expCats, c[1]), desc:(c[2] || '').trim().slice(0, 80), amount:amt, pay:pickFrom(S.pays, c[4])});
  });
  return {ok:ok, bad:bad};
}

  function nice(x){ if (x <= 0) return 1000; var m = Math.pow(10, Math.floor(Math.log10(x))), n = x / m; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * m; }
  function axisLabel(v){ var a = Math.abs(v), t; if (a >= 1e6) t = (+(a / 1e6).toFixed(1)) + 'm'; else if (a >= 1000) t = (+(a / 1000).toFixed(1)) + 'k'; else t = String(a); return (v < 0 ? '−' : '') + t; }
  function lineChart(labels, s1, s2, aria, every){
    var n = labels.length, W = 640, H = 290, L = 68, R = 16, T = 14, B = 34;
    var maxV = Math.max.apply(null, s1.concat(s2, [0])), minV = Math.min.apply(null, s1.concat(s2, [0]));
    var step = (maxV <= 0 && minV >= 0) ? 1000 : nice(Math.max(maxV, -minV) / 4);
    var top = Math.max(Math.ceil(maxV / step) * step, step), bot = Math.floor(minV / step) * step;
    var y = function(v){ return T + (top - v) / (top - bot) * (H - T - B); };
    var x = function(i){ return n > 1 ? L + (W - L - R) * i / (n - 1) : (L + W - R) / 2; };
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(aria) + '">';
    for (var v = bot; v <= top + 0.001; v += step){
      out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
             '<text x="' + (L - 8) + '" y="' + (y(v) + 6) + '" text-anchor="end">' + axisLabel(v) + '</text>';
    }
    out += '<line class="zero" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>';
    [[s1, '1', 'Sales'], [s2, '2', 'Net profit']].forEach(function(sr){
      out += '<polyline class="ln ln' + sr[1] + '" points="' + sr[0].map(function(v, i){ return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ') + '"/>';
      sr[0].forEach(function(v, i){
        out += '<circle class="dot' + sr[1] + '" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="4"><title>' + esc(labels[i]) + ' ' + sr[2] + ': ' + money(v) + '</title></circle>';
      });
    });
    labels.forEach(function(lb, i){
      if ((n - 1 - i) % every === 0) out += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="' + (i === n - 1 && n > 1 ? 'end' : 'middle') + '">' + esc(lb) + '</text>';
    });
    return out + '</svg>';
  }

      var amt2 = parseFloat(f.elements['amt'].value);
      if (!rowp || !rec) return commit('That sale could not be found.', true);
      if (!(amt2 > 0)) return commit('Enter the amount received.', true);
      if (amt2 > rowp.owed + 1e-9) return commit('That is more than the ' + money(rowp.owed) + ' still owed.', true);
      var np = rowp.paid + amt2;
      if (np >= rowp.total - 1e-9) delete rec.paid; else rec.paid = np;
      ui.payFor = null;
      commit(np >= rowp.total - 1e-9 ? 'Paid in full. Thank you!' : 'Payment recorded. ' + money(rowp.total - np) + ' still owed.');
    } else if (id === 'prodForm'){
      var sku = f.sku.value.trim(), name = f.elements['name'].value.trim();
      var buy = parseFloat(f.buy.value), sell = parseFloat(f.sell.value), open = parseInt(f.open.value, 10);
      if (!sku || !name) return formError(f, 'Enter a SKU and a product name.');
      if (!(buy >= 0) || !(sell >= 0) || !(open >= 0)) return formError(f, 'Prices and opening stock must be zero or more.');
      if (ui.edit){
        var p = S.products.filter(function(x){ return x.sku === ui.edit; })[0];
        p.name = name; p.cat = f.cat.value; p.buy = buy; p.sell = sell; p.open = open; ui.edit = null;
        commit('Product updated. Past sales keep the prices they were recorded at.');
      } else {
        if (S.products.some(function(x){ return x.sku.toLowerCase() === sku.toLowerCase(); })) return formError(f, 'That SKU is already used. Pick a different code.');
        S.products.push({sku:sku, name:name, cat:f.cat.value, buy:buy, sell:sell, open:open, restock:0});
        commit('Product added.');
      }
    } else if (id === 'restockForm'){
      var add = parseInt($('#restockQty').value, 10), pr = S.products.filter(function(x){ return x.sku === f.dataset.sku; })[0];
      if (!(add >= 1) || !pr) return commit('Enter how many units you added.', true);
      pr.restock += add; ui.restock = null;
      commit(add + ' unit' + (add === 1 ? '' : 's') + ' added to ' + pr.name + '.');
    } else if (id === 'expForm'){
      var amt = parseFloat(f.amount.value);
      if (!(amt > 0) || !f.date.value) return formError(f, 'Enter a date and an amount above zero.');
      ui.lastPay = f.pay.value;
      S.expenses.push({id:S.nextId++, date:f.date.value, cat:f.cat.value, desc:f.desc.value.trim(), amount:amt, pay:f.pay.value});
      commit('Expense saved.');
    } else if (id === 'setForm'){
      var lines = function(v){ var seen = {}; return v.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ if (!s || seen[s]) return false; seen[s] = 1; return true; }); };
      var c = lines($('#stCats').value), ch = lines($('#stChan').value), pa = lines($('#stPays').value), ex = lines($('#stExp').value);
      var low = parseInt(f.low.value, 10);
      if (!c.length || !ch.length || !pa.length || !ex.length) return formError(f, 'Each list needs at least one item.');
      if (!(low >= 0)) return formError(f, 'The stock alert level must be zero or more.');
      S.shop = f.shop.value.trim() || 'My Shop'; S.low = low; S.cats = c; S.channels = ch; S.pays = pa; S.expCats = ex;
      commit('Settings saved.');
    }
  });

  function restoreFrom(raw, el){
    var o = null;
    try { o = JSON.parse(String(raw).replace(/^\uFEFF/, '').trim()); } catch(err){}
    if (!valid(o)) return formError(el, 'That does not look like a backup from this tracker. Choose the backup file, or paste the full text.');
    S = fill(o); commit('Backup restored.');
  }
  function saveFile(){
    S.lastBackup = today();
    var name = 'seller-tracker-backup-' + today() + '.json', txt = JSON.stringify(S);
    try {
      var blob = new Blob([txt], {type:'application/json'}), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    } catch(err){ var d = $('#backupBox'), t = $('#backupText'); if (d) d.open = true; if (t){ t.value = txt; t.focus(); t.select(); } return; }
    commit('Backup file created: ' + name + '. Look in your Downloads folder.');
  }
  function runImport(check){
    var kind = IMP[ui.impKind] ? ui.impKind : 'products', rows = parseTable(ui.impText || '');
    if (!rows.length) return {err:'Paste your list first.'};
    var fn = kind === 'products' ? importProducts : kind === 'sales' ? importSales : importExpenses;
    return {kind:kind, res:fn(S, rows)};
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.dataset.act, id = b.dataset.id;
    if (act === 'close-sheet' && b.classList.contains('sheet-back') && e.target !== b) return;
    if (act === 'ask'){ ui.confirm = {act:b.dataset.do, id:id}; render(); }
    else if (act === 'no'){ ui.confirm = null; render(); }
    else if (act === 'yes' && ui.confirm){
      var c = ui.confirm;
      if (c.act === 'del-sale'){ S.sales = S.sales.filter(function(s){ return String(s.id) !== String(c.id); }); commit('Sale deleted.'); }
      else if (c.act === 'del-exp'){ S.expenses = S.expenses.filter(function(x){ return String(x.id) !== String(c.id); }); commit('Expense deleted.'); }
      else if (c.act === 'del-prod'){
        if (S.sales.some(function(s){ return s.sku === c.id; })) return commit('This product has sales recorded, so it cannot be deleted. Set its stock to 0 instead.', true);
        S.products = S.products.filter(function(p){ return p.sku !== c.id; }); commit('Product deleted.');
      }
      else if (c.act === 'clear-all'){ S = carry(blankData(new Date().getFullYear())); commit('Everything cleared. You are starting fresh.'); }
      else if (c.act === 'load-sample'){ S = carry(sampleData()); commit('Sample data loaded.'); }
    }
    else if (act === 'set-view' || act === 'set-bd' || act === 'set-trend' || act === 'set-accent' || act === 'set-layout' || act === 'set-density'){
      if (act === 'set-view') S.view = id === 'bars' ? 'bars' : 'pie';
      else if (act === 'set-bd') S.breakdown = BD_KEYS.indexOf(id) >= 0 ? id : 'money';
      else if (act === 'set-trend') S.trend = id === 'monthly' ? 'monthly' : 'weekly';
      else if (act === 'set-accent') S.accent = ACCENTS.indexOf(id) >= 0 ? id : 'green';
      else if (act === 'set-layout') S.layout = id === 'numbers' ? 'numbers' : 'pie';
      else S.density = id === 'compact' ? 'compact' : 'comfortable';
      save(); render();
      var nb = document.querySelector('[data-act="' + act + '"][data-id="' + id + '"]'); if (nb) nb.focus();
    }
    else if (act === 'open-sheet') openSheet();
    else if (act === 'close-sheet') closeSheet();
    else if (act === 'edit-prod'){ ui.edit = id; ui.restock = null; render(); var pf = $('#prodForm'); if (pf) pf.scrollIntoView({block:'start'}); }
    else if (act === 'cancel-edit'){ ui.edit = null; render(); }
    else if (act === 'restock'){ ui.restock = ui.restock === id ? null : id; render(); var q = $('#restockQty'); if (q) q.focus(); }
    else if (act === 'hide-sample'){ S.sample = false; save(); render(); }
    else if (act === 'paid-full'){
      var rec = S.sales.filter(function(s){ return String(s.id) === String(id); })[0];
      if (rec){ delete rec.paid; ui.payFor = null; commit('Marked as paid. Thank you!'); }
    }
    else if (act === 'pay-open'){ ui.payFor = ui.payFor === Number(id) ? null : Number(id); render(); var pa = $('#payAmt'); if (pa) pa.focus(); }
    else if (act === 'remind'){
      var g = owedList(enrich(S)).list.filter(function(x){ return x.key === id; })[0];
      if (g) copyText(remindText(g), 'Reminder copied. Paste it into WhatsApp.', 'remind', id);
    }
    else if (act === 'copy-week'){
      var E0 = enrich(S); copyText(weekText(weekCompare(S, E0, today()), owedList(E0)), 'Summary copied. Paste it into WhatsApp.', 'week', 'w');
    }
    else if (act === 'start-fresh' || act === 'try-sample'){
      var nm = ($('#wName').value || '').trim();
      if (act === 'start-fresh'){ S = carry(blankData(new Date().getFullYear())); S.shop = nm || 'My Shop'; ui.flash = 'Welcome! Add your first product to get going.'; }
      else { S.welcomed = true; ui.flash = ''; }
      save();
      if (act === 'start-fresh' && location.hash !== '#stock') location.hash = '#stock'; else render();
    }
    else if (act === 'imp-check'){
      var r = runImport();
      if (r.err) return formError(b, r.err);
      ui.impRes = r.res; render();
      var rr = $('#impRes'); if (rr) rr.scrollIntoView({block:'nearest'});
    }
    else if (act === 'imp-do'){
      var r2 = runImport();
      if (r2.err) return formError(b, r2.err);
      if (!r2.res.ok.length) return formError(b, 'There are no valid rows to import.');
      var n = r2.res.ok.length, bad = r2.res.bad;
      if (r2.kind === 'products') r2.res.ok.forEach(function(x){ S.products.push(x); });
      else if (r2.kind === 'sales') r2.res.ok.forEach(function(x){ x.id = S.nextId++; S.sales.push(x); });
      else r2.res.ok.forEach(function(x){ x.id = S.nextId++; S.expenses.push(x); });
      ui.impText = bad.map(function(x){ return x.raw; }).join('\n'); ui.impRes = null;
      commit('Imported ' + n + ' ' + r2.kind.replace(/s$/, '') + (n === 1 ? '' : 's') + '.' + (bad.length ? ' ' + bad.length + ' skipped row' + (bad.length === 1 ? ' is' : 's are') + ' left in the box so you can fix them.' : ''));
    }
    else if (act === 'save-file') saveFile();
    else if (act === 'copy-backup'){
      var txt = JSON.stringify(S), show = function(){ var d = $('#backupBox'), t = $('#backupText'); if (d) d.open = true; if (t){ t.value = txt; t.focus(); t.select(); } };
      try { navigator.clipboard.writeText(txt).then(function(){ S.lastBackup = today(); save(); ui.flash = 'Backup copied. Paste it somewhere safe.'; render(); }, show); } catch(err){ show(); }
    }
    else if (act === 'restore'){
      restoreFrom($('#restoreText').value || '', b);
    }
  });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
